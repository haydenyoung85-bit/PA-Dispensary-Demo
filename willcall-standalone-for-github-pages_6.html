<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SEK Sites dispensary order-ahead demo — Keystone Provisions Will-Call Board">
<style>:root{color-scheme:dark}html,body{margin:0;padding:0;background:#0A0A0A}</style>
</head>
<title>Will-Call Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface-2:#1A1A1A; --surface-3:#202020;
    --text:#F2F2F0; --text-soft:#9C9C9C; --text-faint:#616161;
    --border:#242424; --border-soft:#1B1B1B; --border-strong:#333333;
    --accent:#2E8B3D; --accent-deep:#256E31; --accent-tint:#152A18; --accent-pale:#101F13;
    --status-new:#D4A017; --status-new-tint:#241C0C;
    --status-prep:#3B82F6; --status-prep-tint:#0F1B2E;
    --status-ready:#2E8B3D; --status-ready-tint:#152A18;
    --warn:#EF4444; --warn-tint:#2A1414;
    --gold:#D4A017; --gold-tint:#241C0C;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px -6px rgba(0,0,0,.6);
    --shadow-lg: 0 8px 28px -10px rgba(0,0,0,.7), 0 24px 56px -20px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,.display{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-weight:700; letter-spacing:-.01em; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono',Consolas,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--accent-tint); color:var(--text);}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:6px; border:1px solid transparent; cursor:pointer;
    font-weight:600; font-size:13.5px; padding:10px 16px; transition:background .12s,border-color .12s,color .12s;
    white-space:nowrap;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:disabled{background:var(--surface-3); color:var(--text-faint); cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:var(--border-strong); color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn-warn{background:transparent; border-color:var(--border-strong); color:var(--warn);}
  .btn-warn:hover{border-color:var(--warn); background:var(--warn-tint);}
  .btn-sm{padding:7px 12px; font-size:12px; border-radius:6px;}
  .btn-gold{background:var(--gold); color:#1a1204;}
  .btn-gold:hover{filter:brightness(1.08);}

  /* ================= PERSISTENT SHELL / NAV ================= */
  #shell{min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .topbar-row1{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:11px 22px; border-bottom:1px solid var(--border-soft);
  }
  .brandmark{display:flex; align-items:center; gap:10px;}
  .brandmark .name{
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px; line-height:1.15; letter-spacing:-.01em;
    border-left:3px solid var(--accent); padding-left:10px;
  }
  .brandmark .name small{display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:10.5px; color:var(--text-faint); letter-spacing:.02em;}
  .powered{
    display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--text-faint); font-weight:600;
    letter-spacing:.03em; text-transform:uppercase;
  }
  .powered .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}
  .powered b{color:var(--text-soft); font-weight:700;}
  /* The "Powered by" chip is nice-to-have chrome, not navigation — on a phone-width
     top bar it's the first thing to go; the same disclosure still lives in the footer. */
  @media (max-width:600px){ .powered{display:none;} }

  .loc-picker{position:relative;}
  .loc-picker-btn{
    display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:7px 11px; cursor:pointer; font-size:12.5px; color:var(--text); max-width:280px;
  }
  .loc-picker-btn .lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); display:block;}
  .loc-picker-btn .val{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .loc-picker-btn svg{flex:none; opacity:.6;}
  .loc-menu{
    position:absolute; right:0; top:calc(100% + 6px); background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:8px; box-shadow:var(--shadow-lg); width:280px; padding:6px; z-index:40; display:none;
  }
  .loc-menu.open{display:block;}
  .loc-menu button{
    width:100%; text-align:left; background:transparent; border:none; border-radius:6px; padding:9px 10px; cursor:pointer;
  }
  .loc-menu button:hover{background:var(--surface-3);}
  .loc-menu .lm-name{font-weight:600; font-size:13px; color:var(--text);}
  .loc-menu .lm-addr{font-size:11px; color:var(--text-soft); margin-top:1px;}
  .loc-menu .lm-off{color:var(--warn); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}

  .topbar-row2{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:9px 22px; flex-wrap:wrap;
  }
  .view-tabs{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px;}
  .view-tab{
    display:flex; align-items:center; gap:7px; border:none; background:transparent; cursor:pointer;
    border-radius:6px; padding:8px 14px; font-weight:600; font-size:12px; letter-spacing:.03em; color:var(--text-soft);
    text-transform:uppercase;
  }
  .view-tab svg{opacity:.8;}
  .view-tab.active{background:var(--accent); color:#fff;}
  .view-tab:not(.active):hover{color:var(--text);}
  /* Icon-only tabs below ~600px — three labeled pills plus the controls on the
     right were wrapping into several stacked rows before any content showed. */
  @media (max-width:600px){
    .view-tab{padding:9px 12px;}
    .view-tab span{display:none;}
  }

  .demo-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .demo-pill{
    display:flex; align-items:center; gap:6px; background:var(--accent-pale); color:var(--accent);
    border:1px solid var(--accent-tint); border-radius:999px; padding:6px 12px; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .demo-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* Below ~600px, Talking Points / Reset Demo / Start Sales Demo collapse behind a
     single "more" button instead of wrapping into their own crowded row — nothing
     is removed, it's reachable exactly like before, just tucked out of the way. */
  .more-menu{position:relative; display:none;}
  @media (max-width:600px){
    .demo-controls{display:none;}
    .more-menu{display:block;}
  }
  .more-btn{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text-soft); cursor:pointer;
  }
  .more-panel{
    position:absolute; right:0; top:calc(100% + 6px); background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:8px; box-shadow:var(--shadow-lg); width:200px; padding:6px; z-index:40; display:none;
  }
  .more-panel.open{display:flex; flex-direction:column; gap:2px;}
  .more-panel button{
    width:100%; text-align:left; background:transparent; border:none; border-radius:6px; padding:10px 11px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:9px;
  }
  .more-panel button:hover{background:var(--surface-3);}
  .more-panel button.is-gold{color:var(--gold);}

  /* ================= DEMO GUIDE BANNER ================= */
  .guide-banner{
    background:var(--surface-2); border-bottom:1px solid var(--border); color:var(--text); padding:13px 22px; display:flex; align-items:center; gap:18px; justify-content:center;
    flex-wrap:wrap; text-align:center;
  }
  .guide-banner .step-badge{
    background:var(--accent-tint); color:var(--accent); border-radius:999px; padding:4px 11px; font-size:10.5px; font-weight:700;
    letter-spacing:.05em; text-transform:uppercase; flex:none;
  }
  .guide-banner .msg{font-size:13.5px; font-weight:500; max-width:620px; color:var(--text-soft);}
  .guide-banner .msg b{font-weight:700; color:var(--text);}
  .guide-banner .actions{display:flex; gap:8px; flex:none;}
  .guide-banner .btn-ghost{border-color:var(--border-strong); color:var(--text);}
  .guide-banner .btn-ghost:hover{border-color:var(--accent); background:var(--surface-3);}
  .guide-banner .btn-gold{padding:9px 16px; font-size:12.5px;}

  /* ================= TALKING POINTS DRAWER ================= */
  .tp-toggle{position:relative;}
  .tp-drawer{
    position:fixed; top:0; right:0; height:100vh; width:320px; background:var(--surface);
    border-left:1px solid var(--border-strong); box-shadow:var(--shadow-lg); z-index:50; padding:20px;
    transform:translateX(100%); transition:transform .22s ease; overflow-y:auto;
  }
  .tp-drawer.open{transform:translateX(0);}
  .tp-drawer h3{font-size:15px; margin:0 0 3px; color:var(--text);}
  .tp-drawer .tp-sub{font-size:11.5px; color:var(--text-faint); margin-bottom:16px;}
  .tp-close{position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer; color:var(--text-soft); padding:4px;}
  .tp-group{margin-bottom:18px;}
  .tp-group-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:8px;}
  .tp-item{display:flex; align-items:flex-start; gap:9px; padding:6px 0; font-size:13px; line-height:1.4; color:var(--text-soft);}
  .tp-item svg{flex:none; margin-top:2px; color:var(--accent);}
  .tp-scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:45; display:none;}
  .tp-scrim.open{display:block;}

  /* ================= CUSTOMER VIEW ================= */
  #content{flex:1;}
  .customer-shell{max-width:1560px; margin:0 auto; padding-bottom:130px;}
  .loc-banner{
    padding:13px 24px; background:var(--surface-2); border-bottom:1px solid var(--border);
    font-size:13px; color:var(--text-soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .loc-banner b{color:var(--text); font-weight:600;}

  .tabs{
    display:flex; gap:3px; padding:14px 24px 0; overflow-x:auto; border-bottom:1px solid var(--border);
  }
  .tab{
    font-size:13px; font-weight:600; color:var(--text-soft); background:transparent;
    border:none; border-radius:6px 6px 0 0; padding:10px 14px 11px; cursor:pointer; border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--surface-2);}
  .tab:not(.active):hover{color:var(--text);}

  .menu-grid{
    /* auto-fit (not auto-fill): with only a couple of items in a category, auto-fill
       still reserves empty phantom columns sized by the container, which left a big
       dead zone on wide/desktop screens instead of filling the row. auto-fit collapses
       unused columns to 0 so the real cards stretch to use the full width instead. */
    display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px; padding:18px 24px;
  }
  .item-card{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:12px; display:flex; flex-direction:column; gap:7px;
  }
  .item-card.oos{opacity:.5;}
  .item-photo{
    width:100%; aspect-ratio:4/3; border-radius:6px; overflow:hidden; position:relative; flex:none;
    background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center;
  }
  .item-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .item-photo .ph-mono{font-family:'Inter',sans-serif; font-weight:800; font-size:26px; opacity:.85;}
  .item-photo .ph-badge{position:absolute; top:7px; left:7px; background:rgba(10,10,10,.72); color:var(--text-soft); font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 6px; border-radius:4px; border:1px solid rgba(255,255,255,.08);}
  .item-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .item-name{font-weight:600; font-size:13.5px; color:var(--text);}
  .item-sub{font-size:11.5px; color:var(--text-faint);}
  .item-specs{display:flex; gap:6px; font-size:10.5px; flex-wrap:wrap;}
  .spec-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:4px;
    padding:3px 6px; font-family:'IBM Plex Mono',monospace; color:var(--text-soft);
  }
  .spec-chip.oos{color:var(--warn); border-color:var(--warn); background:var(--warn-tint); font-family:'Inter',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .item-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px;}
  .item-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; color:var(--text);}
  .qty-stepper{display:flex; align-items:center; gap:0; border:1px solid var(--border-strong); border-radius:6px; overflow:hidden;}
  .qty-stepper button{
    width:28px; height:28px; border:none; background:var(--surface-2); color:var(--text); cursor:pointer; font-size:15px; font-weight:600;
  }
  .qty-stepper button:hover{background:var(--surface-3);}
  .qty-stepper .qty-val{width:24px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text);}
  .add-btn{
    background:var(--accent); color:#fff; border:none; border-radius:6px;
    padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .add-btn:hover{background:var(--accent-deep);}

  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--surface);
    border-top:1px solid var(--border-strong); box-shadow:0 -8px 24px -12px rgba(0,0,0,.6);
    padding:13px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; z-index:20;
  }
  /* Some static hosts (e.g. Netlify) inject their own small "powered by" badge as a
     fixed, very-high-z-index overlay in the bottom-right corner — it can briefly sit
     directly on top of the Review Order button and swallow the click. This has no
     effect unless a host actually injects such a badge (harmless everywhere else,
     including the Claude Artifact version, which never has one). */
  body:has(#nl-badge-frame) .cart-bar{ padding-right:220px; }
  @media (max-width:700px){
    body:has(#nl-badge-frame) .cart-bar{ padding-right:110px; }
  }
  .cart-summary{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--text-soft);}
  .cart-count{
    background:var(--accent); color:#fff; border-radius:999px; min-width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; padding:0 6px;
  }
  .cart-total{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; color:var(--text);}

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center;
    z-index:60;
  }
  @media (min-width:640px){ .sheet-overlay{align-items:center;} }
  .sheet{
    background:var(--surface); border:1px solid var(--border-strong); width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:10px 10px 0 0; padding:20px 20px 24px; box-shadow:var(--shadow-lg);
  }
  @media (min-width:640px){ .sheet{border-radius:10px;} }
  .sheet h2{margin:0 0 4px; font-size:18px; color:var(--text);}
  .sheet .sub{font-size:12.5px; color:var(--text-faint); margin-bottom:16px;}
  .line-item{display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--border-soft); color:var(--text);}
  .line-item .li-name{color:var(--text);}
  .line-item .li-price{font-family:'IBM Plex Mono',monospace; color:var(--text-soft);}
  .totals-row{display:flex; justify-content:space-between; padding:10px 0 4px; font-weight:600; font-size:14.5px; color:var(--text);}

  .field{margin-top:13px;}
  .field label{display:block; font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
  .field input[type=text], .field input[type=tel], .field select, .field textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:6px; padding:9px 11px;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .check-row{display:flex; gap:10px; align-items:flex-start; margin-top:15px; font-size:12.5px; color:var(--text-soft); line-height:1.45;}
  .check-row input{margin-top:3px; accent-color:var(--accent);}
  .disclosure{font-size:11.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-top:14px;}

  .ticket{text-align:center; padding:8px 4px 4px;}
  .ticket .code{font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:600; letter-spacing:.04em; margin:14px 0 6px; color:var(--text);}
  .ticket .status-pill{
    display:inline-block; background:var(--status-new-tint); color:var(--status-new);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .ticket-info{text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-top:16px; font-size:13px; color:var(--text-soft);}
  .ticket-info div{padding:3px 0;}
  .ticket-info b{color:var(--text);}

  /* ================= STAFF VIEW ================= */
  .staff-shell{max-width:1440px; margin:0 auto; padding:18px 22px 40px;}
  .staff-meta{display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
  .stat{font-size:12.5px; color:var(--text-faint);}
  .stat b{font-family:'IBM Plex Mono',monospace; color:var(--text); font-size:14px; font-weight:600;}

  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:860px){ .board{grid-template-columns:1fr;} }
  .col{background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--border-strong); border-radius:8px; overflow:hidden; min-height:120px;}
  .col-head{display:flex; align-items:center; justify-content:space-between; padding:12px 15px; border-bottom:1px solid var(--border);}
  .col-head .title{font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em;}
  .col-head .count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-faint);}
  .col[data-status="new"]{border-top-color:var(--status-new);}
  .col[data-status="new"] .col-head .title{color:var(--status-new);}
  .col[data-status="preparing"]{border-top-color:var(--status-prep);}
  .col[data-status="preparing"] .col-head .title{color:var(--status-prep);}
  .col[data-status="ready"]{border-top-color:var(--status-ready);}
  .col[data-status="ready"] .col-head .title{color:var(--status-ready);}
  .col-body{padding:10px; display:flex; flex-direction:column; gap:8px;}
  .empty-col{font-size:12.5px; color:var(--text-faint); text-align:center; padding:26px 8px;}

  .order-card{
    border:1px solid var(--border); border-radius:8px; padding:12px 13px; background:var(--surface-2);
  }
  .oc-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .oc-code{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:var(--text);}
  .oc-elapsed{font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
  .oc-elapsed.late{color:var(--warn); font-weight:600;}
  .oc-name{font-size:13px; font-weight:600; margin-top:4px; color:var(--text);}
  .oc-phone{font-size:11.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
  .oc-items{margin-top:8px; font-size:12px; color:var(--text-soft);}
  .oc-items div{display:flex; justify-content:space-between; padding:2px 0;}
  .oc-note{margin-top:6px; font-size:11.5px; color:var(--text-faint); font-style:italic;}
  .oc-actions{margin-top:10px; display:flex; gap:8px;}
  .oc-actions button{flex:1;}

  .center-pad{max-width:640px;margin:60px auto;padding:0 24px;text-align:center;}

  // ---------------------------------------------------------------
  // REAL PICKUP SCHEDULING ENGINE
  // Generates actual calendar dates + real clock-time slots from each
  // location's structured hours — no "in 30 minutes" placeholders.
  // ---------------------------------------------------------------
  var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var PICKUP_LEAD_MINUTES = 20; // earliest a "today" slot can be is now + this buffer

  function dateAtOffset(offsetDays){
    var d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()+offsetDays);
    return d;
  }
  function fmtTime12(hh, mm){
    var h = hh%12; if(h===0) h=12;
    var ampm = hh<12 ? "AM":"PM";
    return h+":"+(mm<10?"0":"")+mm+" "+ampm;
  }
  function fmtFullDate(d){
    return WEEKDAY_NAMES[d.getDay()]+", "+MONTH_NAMES[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
  }
  function fmtShortDate(d){
    return WEEKDAY_NAMES[d.getDay()].slice(0,3)+", "+MONTH_NAMES[d.getMonth()].slice(0,3)+" "+d.getDate();
  }
  // Up to 3 real calendar days (today, tomorrow, day after), skipping any day the
  // location is closed. Returns [{offset, dateObj, label}]
  function pickupDayOptions(loc){
    var out = [];
    for(var offset=0; offset<3; offset++){
      var d = dateAtOffset(offset);
      var hrs = (loc.hoursStruct||[])[d.getDay()];
      if(!hrs) continue; // closed that day
      var label = offset===0 ? "Today" : offset===1 ? "Tomorrow" : fmtShortDate(d);
      out.push({ offset:offset, dateObj:d, label:label });
    }
    return out;
  }
  // Real 30-minute pickup slots for one specific calendar date, honoring the
  // location's open/close time and (for today) blocking times already in the past.
  function pickupTimeSlots(loc, dateObj){
    var hrs = (loc.hoursStruct||[])[dateObj.getDay()];
    if(!hrs) return [];
    var slots = [];
    var openParts = hrs.open.split(":"), closeParts = hrs.close.split(":");
    var openMin = (+openParts[0])*60 + (+openParts[1]);
    var closeMin = (+closeParts[0])*60 + (+closeParts[1]);
    var now = new Date();
    var isToday = dateObj.toDateString()===now.toDateString();
    var earliestMin = isToday ? (now.getHours()*60+now.getMinutes()+PICKUP_LEAD_MINUTES) : -1;
    for(var m=openMin; m<=closeMin; m+=30){
      if(m<earliestMin) continue;
      var hh = Math.floor(m/60), mm = m%60;
      var value = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0")+"T"+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
      slots.push({ value:value, label:fmtTime12(hh,mm), hh:hh, mm:mm });
    }
    return slots;
  }
  function pickupDateTimeMs(dateObj, hh, mm){
    var d = new Date(dateObj.getTime());
    d.setHours(hh, mm, 0, 0);
    return d.getTime();
  }
  function timeAgo(ts){
    var mins = Math.max(0, Math.round((Date.now()-ts)/60000));
    if(mins<1) return "just now";
    if(mins===1) return "1 min ago";
    if(mins<60) return mins+" min ago";
    var h = Math.floor(mins/60);
    return h+"h "+(mins%60)+"m ago";
  }

  function resizeImageFile(file, maxSide, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide / Math.max(w,h));
        var cw = Math.round(w*scale), ch = Math.round(h*scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        try{ cb(canvas.toDataURL("image/jpeg", 0.82)); }catch(err){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  // Synthetic 1-29-day-old order history per location, used only to populate the
  // Location Owner Dashboard's history table (Yesterday/7 days/30 days filters).
  // Not part of the live "orders" collection — today's real activity always comes
  // from that live feed instead, the same one Staff/Admin Orders read.
  var HIST_NAMES = ["Diane R.","Marcus H.","Priya S.","Alan B.","Jordan K.","Sam W.","Casey T.","Morgan L.","Riley P.","Devon G.","Taylor N.","Jamie F.","Erin B.","Chris O."];
  function genHistory(locId){
    var menu = menuFor(locId);
    if(!menu.length) return [];
    var rows = [];
    var now = Date.now();
    for(var d=1; d<=29; d++){
      var dayStart = now - d*86400000;
      var count = 2 + Math.floor(Math.random()*4); // 2-5 orders/day
      for(var i=0;i<count;i++){
        var lineCount = 1 + Math.floor(Math.random()*2);
        var items = [], total = 0;
        for(var j=0;j<lineCount;j++){
          var m = menu[Math.floor(Math.random()*menu.length)];
          var qty = 1 + Math.floor(Math.random()*2);
          items.push({name:m.name, price:m.price, qty:qty});
          total += m.price*qty;
        }
        total = Math.round(total*100)/100;
        rows.push({
          locationId: locId, id:"hist_"+d+"_"+i+"_"+Math.random().toString(36).slice(2,6),
          orderNumber: orderNumber(), customerName: HIST_NAMES[Math.floor(Math.random()*HIST_NAMES.length)],
          items: items, subtotal: total, total: total, status:"completed", pickupPref:"Picked up",
          createdAt: dayStart + 9*3600000 + Math.floor(Math.random()*9*3600000)
        });
      }
    }
    return rows;
  }

      wrap.appendChild(pausedBanner);
    }

    var tabs = ce("div","tabs");
    CATS.forEach(function(c){
      var t = ce("button","tab"+(c===nav.activeCat?" active":""), c);

        nav.activeCat = c;
        Array.prototype.forEach.call(tabs.children, function(el){ el.classList.toggle("active", el.textContent===c); });
        renderGrid();
      });
      tabs.appendChild(t);
    });
    wrap.appendChild(tabs);

    var grid = ce("div","menu-grid");
    wrap.appendChild(grid);

    function renderGrid(){
      grid.innerHTML = "";
      menuFor(loc.id).filter(function(m){ return m.cat===nav.activeCat && m.active!==false; }).forEach(function(item){
        var card = ce("div","item-card"+(item.inStock?"":" oos"));
        card.innerHTML += photoTile(item,"item-photo");
        card.appendChild(ce("div","item-top",
          "<div><div class='item-name'>"+item.name+"</div><div class='item-sub'>"+item.sub+"</div></div>"+
          "<div class='item-price mono'>"+money(item.price)+"</div>"
        ));
        card.appendChild(ce("div","item-specs",
          item.inStock
            ? "<span class='spec-chip'>"+item.thc+"</span><span class='spec-chip'>"+item.cbd+"</span>"
            : "<span class='spec-chip oos'>Sold out</span>"
        ));
        var bottom = ce("div","item-bottom");
        if(item.inStock && !ordersPaused){
          var qty = nav.cart[item.id]||0;
          if(qty>0){
            var stepper = ce("div","qty-stepper");
            var minus = ce("button",null,"−");
            var val = ce("span","qty-val",String(qty));
            var plus = ce("button",null,"+");
            minus.addEventListener("click", function(){ nav.cart[item.id]=Math.max(0,(nav.cart[item.id]||0)-1); if(!nav.cart[item.id]) delete nav.cart[item.id]; renderGrid(); updateCartBar(); });
            plus.addEventListener("click", function(){ nav.cart[item.id]=(nav.cart[item.id]||0)+1; renderGrid(); updateCartBar(); });
            stepper.appendChild(minus); stepper.appendChild(val); stepper.appendChild(plus);
            bottom.appendChild(stepper);
          } else {
            var add = ce("button","add-btn","Add");
            add.addEventListener("click", function(){ nav.cart[item.id]=1; renderGrid(); updateCartBar(); });
            bottom.appendChild(add);
          }
        } else if(item.inStock && ordersPaused){
          var disabledAdd = ce("button","add-btn","Add");
          disabledAdd.disabled = true;
          disabledAdd.style.cssText = "background:var(--surface-3); color:var(--text-faint); cursor:not-allowed;";
          bottom.appendChild(disabledAdd);
        }
        card.appendChild(bottom);
        grid.appendChild(card);
      });
    }
    renderGrid();

    var cartBar = ce("div","cart-bar");
    cartBar.style.display = "none";
    var summary = ce("div","cart-summary");
    var countEl = ce("span","cart-count","0");
    summary.appendChild(countEl);
    summary.appendChild(document.createTextNode("items"));
    var totalEl = ce("div","cart-total","$0.00");
    var reviewBtn = ce("button","btn btn-primary","Review Order");
    reviewBtn.addEventListener("click", function(){ openCheckout(); });
    cartBar.appendChild(summary);
    cartBar.appendChild(totalEl);
    cartBar.appendChild(reviewBtn);
    wrap.appendChild(cartBar);

    function cartItems(){
      return Object.keys(nav.cart).map(function(id){
        var m = menuItem(id, loc.id);
        if(!m || m.active===false){ delete nav.cart[id]; return null; } // admin removed/deactivated it mid-order — drop it silently
        return { id:id, name:m.name, price:m.price, qty:nav.cart[id] };
      }).filter(Boolean);
    }
    function cartTotal(){ return cartItems().reduce(function(s,i){ return s+i.price*i.qty; }, 0); }
    function updateCartBar(){
      var items = cartItems();
      var n = items.reduce(function(s,i){return s+i.qty;},0);
      countEl.textContent = String(n);
      totalEl.textContent = money(cartTotal());
      cartBar.style.display = n>0 ? "flex" : "none";
    }

    function openCheckout(){
      var items = cartItems();
      if(!items.length) return;
      var overlay = ce("div","sheet-overlay");
      var sheet = ce("div","sheet");
      var body = ce("div");
      body.appendChild(ce("h2",null,"Review your order"));
      body.appendChild(ce("div","sub", loc.name));
      items.forEach(function(i){
        body.appendChild(ce("div","line-item",
          "<span class='li-name'>"+i.qty+" × "+i.name+"</span><span class='li-price mono'>"+money(i.price*i.qty)+"</span>"
        ));
      });
      body.appendChild(ce("div","totals-row","<span>Total due at pickup</span><span class='mono'>"+money(cartTotal())+"</span>"));

      var dayOpts = pickupDayOptions(loc);

      var form = ce("div");
      form.innerHTML =
        "<div class='field'><label>Full name</label><input type='text' id='wc-name' placeholder='As it appears on your ID'></div>"+
        "<div class='field'><label>Phone</label><input type='tel' id='wc-phone' placeholder='(570) 555-0100'></div>"+
        "<div class='admin-grid2'>"+
          "<div class='field' style='margin-top:0;'><label>Pickup date</label><select id='wc-date'>"+
            (dayOpts.length ? dayOpts.map(function(d,i){ return "<option value='"+i+"'>"+d.label+"</option>"; }).join("") : "<option value=''>No pickup days available</option>")+
          "</select></div>"+
          "<div class='field' style='margin-top:0;'><label>Pickup time</label><select id='wc-time'></select></div>"+
        "</div>"+
        "<div class='field'><label>Notes (optional)</label><textarea id='wc-notes' placeholder='Substitutions, questions for the budtender, etc.'></textarea></div>";
      body.appendChild(form);

      var dateSel = qs("#wc-date",body), timeSel = qs("#wc-time",body);
      function fillTimeOptions(){
        var dIdx = parseInt(dateSel.value,10);
        var dayOpt = dayOpts[dIdx];
        if(!dayOpt){ timeSel.innerHTML = "<option value=''>—</option>"; return; }
        var slots = pickupTimeSlots(loc, dayOpt.dateObj);
        timeSel.innerHTML = slots.length
          ? slots.map(function(s,i){ return "<option value='"+i+"'>"+(i===0&&dayOpt.offset===0?"First available — ":"")+s.label+"</option>"; }).join("")
          : "<option value=''>No slots left today</option>";
      }
      fillTimeOptions();
      dateSel.addEventListener("change", fillTimeOptions);

      var checkRow = ce("label","check-row",
        "<input type='checkbox' id='wc-idconfirm'> I confirm I hold a valid Pennsylvania medical marijuana ID card and will present it with a photo ID at pickup."
      );
      body.appendChild(checkRow);
      body.appendChild(ce("div","disclosure",
        "This reserves your order &mdash; it is not paid for yet. "+(loc.acceptDebit?"Debit accepted at pickup (cash also fine; small ATM fee may apply on debit).":"Cash payment required at pickup.")+" "+loc.name+" will hold your order for 2 hours past your pickup time."
      ));

      var placeBtn = ce("button","btn btn-primary","Place Order — Pay at Pickup");
      placeBtn.style.width = "100%";
      placeBtn.style.marginTop = "18px";
      placeBtn.disabled = true;
      body.appendChild(placeBtn);

      var cancelBtn = ce("button","btn btn-ghost","Back to menu");
      cancelBtn.style.width = "100%"; cancelBtn.style.marginTop = "8px";
      cancelBtn.addEventListener("click", function(){ overlay.remove(); });
      body.appendChild(cancelBtn);

      function validate(){
        var name = qs("#wc-name",body).value.trim();
        var phone = qs("#wc-phone",body).value.trim();
        var ok = qs("#wc-idconfirm",body).checked;
        var hasSlot = dateSel.value!=="" && timeSel.value!=="";
        placeBtn.disabled = !(name && phone && ok && hasSlot);
      }
      ["input","change"].forEach(function(ev){
        body.addEventListener(ev, validate);
      });

      placeBtn.addEventListener("click", function(){
        placeBtn.disabled = true; placeBtn.textContent = "Sending order…";
        var dayOpt = dayOpts[parseInt(dateSel.value,10)];
        var slots = dayOpt ? pickupTimeSlots(loc, dayOpt.dateObj) : [];
        var slot = slots[parseInt(timeSel.value,10)] || {hh:12,mm:0,label:"—"};
        var pickupDateTime = dayOpt ? pickupDateTimeMs(dayOpt.dateObj, slot.hh, slot.mm) : Date.now();
        var pickupPrefLabel = dayOpt ? (dayOpt.offset===0 ? "Today, "+fmtFullDate(dayOpt.dateObj) : fmtFullDate(dayOpt.dateObj))+" at "+slot.label : "—";
        var num = orderNumber();
        var custName = qs("#wc-name",body).value.trim();
        var custPhone = qs("#wc-phone",body).value.trim();
        var subtotal = cartTotal();
        var order = {
          id: "ord_"+num+"_"+Math.random().toString(36).slice(2,7),
          locationId: loc.id,
          orderCode: orderCode(),
          orderNumber: num,
          customerName: custName,
          customerPhone: custPhone,
          phone: custPhone, // kept for older UI code that still reads .phone
          pickupDate: dayOpt ? dayOpt.label : "",
          pickupTime: slot.label,
          pickupDateTime: pickupDateTime,
          pickupPref: pickupPrefLabel,
          paymentMethod: loc.acceptDebit ? "Debit or cash" : "Cash only",
          notes: qs("#wc-notes",body).value.trim(),
          items: items.map(function(i){ return {name:i.name, price:i.price, qty:i.qty}; }),
          subtotal: subtotal,
          total: subtotal,
          status: "new",
          sentToPos: false,
          createdAt: Date.now()
        };
        function localFallback(){
          state.orders.push(order);
          showTicket(order);
        }
        if(!db){ localFallback(); return; }
        db.collection("orders").doc().set(order).then(function(){ showTicket(order); }).catch(localFallback);
      });

      sheet.appendChild(body);
      overlay.appendChild(sheet);
      document.body.appendChild(overlay);

      function showTicket(order){
        body.innerHTML = "";
        var t = ce("div","ticket");
        t.innerHTML =
          "<div class='status-pill'>Order received</div>"+
          "<h2 style='margin-bottom:0;'>You're on the board</h2>"+
          "<div class='code mono'>"+order.orderCode+"</div>"+
          "<div style='color:var(--text-soft);font-size:13.5px;'>Show this code at the counter</div>"+
          "<div class='ticket-info'>"+
            "<div><b>"+loc.name+"</b></div>"+
            "<div>"+loc.address+"</div>"+
            "<div>"+loc.phone+"</div>"+
            "<div style='margin-top:8px;'><b>"+order.pickupPref+"</b> · "+money(order.subtotal)+" due at pickup</div>"+
            "<div>"+order.paymentMethod+" — valid PA medical ID required</div>"+
          "</div>";
        var close = ce("button","btn btn-primary","Done");
        close.style.width="100%"; close.style.marginTop="18px";
        close.addEventListener("click", function(){ overlay.remove(); nav.cart={}; renderGrid(); updateCartBar(); });
        t.appendChild(close);
        body.appendChild(t);
      }
    }

    root.innerHTML = "";
    root.appendChild(wrap);
  }

  var STATUSES = [ {k:"new",label:"New"}, {k:"preparing",label:"Preparing"}, {k:"ready",label:"Ready for pickup"} ];

  function renderStaff(root){
    var loc = locById(nav.locId) || state.locations[0];
    var wrap = ce("div","staff-shell");

    var meta = ce("div","staff-meta");
    meta.innerHTML = "<div class='stat'>Viewing <b>"+loc.name+"</b></div><div class='stat' id='wc-count'></div>";
    wrap.appendChild(meta);

    var board = ce("div","board");
    var cols = {};
    STATUSES.forEach(function(s){
      var col = ce("div","col"); col.dataset.status = s.k;
      col.innerHTML = "<div class='col-head'><span class='title'>"+s.label+"</span><span class='count mono' id='cnt-"+s.k+"'>0</span></div>";
      var body = ce("div","col-body"); body.id = "body-"+s.k;
      col.appendChild(body);
      cols[s.k] = body;
      board.appendChild(col);
    });
    wrap.appendChild(board);

    root.innerHTML = "";
    root.appendChild(wrap);

    if(renderStaff._timer) clearInterval(renderStaff._timer);
    var currentOrders = [];
    renderStaff._timer = setInterval(function(){ paint(currentOrders); }, 30000);

    function nextStatus(s){ return s==="new" ? "preparing" : (s==="preparing" ? "ready" : "completed"); }
    function actionLabel(s){ return s==="new" ? "Start preparing" : (s==="preparing" ? "Mark ready" : "Complete pickup"); }

    function advance(order){
      var to = nextStatus(order.status);
      if(to==="completed"){ toast("Order "+order.orderCode+" — completed, picked up"); }
      if(order._ref){
        order._ref.update({status:to}).catch(function(){});
        if(to==="completed"){ order.status = to; paint(currentOrders); } // optimistic — leaves the board instantly even before the write round-trips
      } else {
        order.status = to;
        paint(currentOrders);
      }
    }

    function paint(orders){
      currentOrders = orders;
      STATUSES.forEach(function(s){ cols[s.k].innerHTML=""; });
      var counts = {new:0,preparing:0,ready:0};
      orders.filter(function(o){ return o.status!=="completed"; }).forEach(function(o){
        if(counts[o.status]===undefined) return;
        counts[o.status]++;
        var card = ce("div","order-card");
        var itemsHtml = o.items.map(function(i){ return "<div><span>"+i.qty+" × "+i.name+"</span><span class='mono'>"+money(i.price*i.qty)+"</span></div>"; }).join("");
        var isLate = o.status!=="ready" && (Date.now()-o.createdAt) >= 15*60000;
        card.innerHTML =
          "<div class='oc-top'><span class='oc-code'>"+o.orderCode+"</span><span class='oc-elapsed"+(isLate?" late":"")+"'>"+timeAgo(o.createdAt)+(isLate?" · late":"")+"</span></div>"+
          "<div class='oc-name'>"+o.customerName+"</div>"+
          "<div class='oc-phone'>"+o.phone+" · "+o.pickupPref+"</div>"+
          "<div class='oc-items'>"+itemsHtml+"</div>"+
          (o.notes ? "<div class='oc-note'>“"+o.notes+"”</div>" : "");
        var actions = ce("div","oc-actions");
        var btn = ce("button","btn btn-primary btn-sm", actionLabel(o.status));
        btn.addEventListener("click", function(){ advance(o); });
        actions.appendChild(btn);
        card.appendChild(actions);
        cols[o.status].appendChild(card);
      });
      STATUSES.forEach(function(s){
        qs("#cnt-"+s.k, wrap).textContent = String(counts[s.k]);
        if(counts[s.k]===0){ cols[s.k].appendChild(ce("div","empty-col","No orders")); }
      });
      qs("#wc-count", wrap).textContent = orders.length + " order" + (orders.length===1?"":"s") + " today";
    }

    // Always drop any listener from a previous render/location before opening a new one —
    // renderStaff() re-runs on every view switch and every live config update, so without
    // this a fresh onSnapshot listener stacked up each time, eventually exhausting the
    // per-view subscription cap and silently breaking live order sync mid-demo.
    if(staffOrdersUnsub){ staffOrdersUnsub(); staffOrdersUnsub=null; }

    if(!db){
      var local = state.orders.filter(function(o){ return o.locationId===loc.id; });
      paint(local.length ? local : sampleOrders(loc.id));
      return;
    }
    var col = db.collection("orders");
    col.where("locationId","==",loc.id).get().then(function(snap){
      if(snap.empty){
        var seeds = sampleOrders(loc.id);
        seeds.forEach(function(o){ col.doc().set(o).catch(function(){}); });
      }
      subscribe();
    }).catch(function(){ paint(sampleOrders(loc.id)); });

    function subscribe(){
      try{
        staffOrdersUnsub = db.collection("orders").where("locationId","==",loc.id).orderBy("createdAt","asc").limit(60).onSnapshot(function(snap){
          var orders = snap.docs.map(function(d){ var data=d.data()||{}; data._ref=d.ref||db.collection("orders").doc(d.id); return data; });
          paint(orders);
        }, function(){ paint(sampleOrders(loc.id)); });
      }catch(e){ paint(sampleOrders(loc.id)); }
    }
  }

  // ---------------------------------------------------------------
  // ADMIN VIEW
  // ---------------------------------------------------------------
  // Persistence is split across documents (one per location's menu, plus one for
  // locations/settings) rather than a single shared doc — each location's product
  // photos alone can approach the ~256KB single-document cap, and combining all
  // three locations' independent catalogs into one doc would blow past it.
  function persistLocations(){
    if(!db) return;
    db.doc("demoConfig/main").set({ locations: state.locations }).catch(function(){});
  }
  function persistMenu(locId){
    if(!db) return;
    db.doc("demoConfig/menu_"+locId).set({ menu: menuFor(locId) }).catch(function(){});
  }

        thumbWrap.innerHTML = photoTile(item,"ai-thumb");

            thumbWrap.innerHTML = photoTile(item,"ai-thumb");

          if(isNaN(v) || v<0) v = item.price;
          item.price = Math.round(v*100)/100;
          priceInput.value = item.price.toFixed(2);
          persistMenu(loc.id); toast(item.name+" price updated");
        });
        priceWrap.appendChild(priceInput);

        var activeWrap = ce("div","aiq ai-cell-active"); activeWrap.style.textAlign="center";
        var activeBtn = ce("button","status-chip-btn"+(isActive?" is-active":""), isActive?"Active":"Inactive");

          item.active = !(item.active!==false);
          persistMenu(loc.id); toast(item.name+(item.active?" is now active":" set to inactive — hidden from customers"));
          render();
        });
        activeWrap.appendChild(activeBtn);
        row.appendChild(activeWrap);

        var stockWrap = ce("div","ai-cell-stock"); stockWrap.style.textAlign="center";
        var sw = ce("label","switch");
        var cb = ce("input"); cb.type="checkbox"; cb.checked = item.inStock;
        cb.addEventListener("change", function(){ item.inStock = cb.checked; persistMenu(loc.id); toast(item.name+(cb.checked?" marked in stock":" marked sold out")); });
        sw.appendChild(cb); sw.appendChild(ce("span","track")); sw.appendChild(ce("span","thumb"));
        stockWrap.appendChild(sw);
        row.appendChild(stockWrap);

        var delWrap = ce("div","ai-cell-del"); delWrap.style.textAlign="center";
        var delBtn = ce("button","del-item-btn", icon("close"));
        delBtn.type="button"; delBtn.title="Delete product";
        delBtn.addEventListener("click", function(){

            render();
            return;
          }
          delBtn.dataset.confirm="1"; delBtn.classList.add("confirming"); delBtn.title="Click again to delete";
          setTimeout(function(){ delBtn.dataset.confirm=""; delBtn.classList.remove("confirming"); delBtn.title="Delete product"; }, 3000);
        });
        delWrap.appendChild(delBtn);
        row.appendChild(delWrap);

        menuCard.appendChild(row);
      });
    });
    main.appendChild(menuCard);
  }

        "<div class='or-pickup'>Pickup: <b>"+(o.pickupPref||"")+"</b> &middot; "+money(o.subtotal)+"</div>";

          o.sentToPos = true;

    if(!db){
      latestOrders = state.orders.filter(function(o){ return o.locationId===loc.id; }).slice().reverse();
      renderRows();
      return;
    }
    try{
      adminOrdersUnsub = db.collection("orders").where("locationId","==",loc.id).orderBy("createdAt","asc").limit(60).onSnapshot(function(snap){
        latestOrders = snap.docs.map(function(d){ var data=d.data()||{}; data._ref=d.ref||db.collection("orders").doc(d.id); return data; }).slice().reverse();
        renderRows();
      }, function(){ latestOrders = state.orders.filter(function(o){ return o.locationId===loc.id; }); renderRows(); });
    }catch(e){ latestOrders = state.orders.filter(function(o){ return o.locationId===loc.id; }); renderRows(); }

  // ADMIN — LOCATION OWNER DASHBOARD (today's KPIs + order history)
  // ---------------------------------------------------------------
  function renderAdminDashboard(main, loc, isOwner){
    var kpiCard = ce("div","admin-card");
    kpiCard.appendChild(ce("h2",null,"Dashboard — "+loc.name));
    kpiCard.appendChild(ce("div","ac-sub","Live activity for this location, updated in real time as orders come in."));
    var kpiGrid = ce("div","fo-grid");
    kpiCard.appendChild(kpiGrid);
    main.appendChild(kpiCard);

    var histCard = ce("div","admin-card");
    histCard.appendChild(ce("h2",null,"Order History"));
    histCard.appendChild(ce("div","ac-sub","Every completed and active order at "+loc.name+", filterable by date range."));
    var filterRow = ce("div","hist-filter-row");
    var filters = [{k:"today",label:"Today"},{k:"yesterday",label:"Yesterday"},{k:"7d",label:"7 days"},{k:"30d",label:"30 days"}];
    var histFilter = "today";
    var filterBtns = {};
    filters.forEach(function(f){
      var b = ce("button", f.k===histFilter?"active":"", f.label);
      b.type="button";
      b.addEventListener("click", function(){
        histFilter = f.k;
        Object.keys(filterBtns).forEach(function(k){ filterBtns[k].classList.toggle("active", k===histFilter); });
        renderHistRows();
      });
      filterBtns[f.k] = b;
      filterRow.appendChild(b);
    });
    histCard.appendChild(filterRow);
    var histList = ce("div","order-list");
    histCard.appendChild(histList);
    main.appendChild(histCard);

    var todayOrders = [];

    function paintKpis(){
      kpiGrid.innerHTML = "";
      var revenue = todayOrders.reduce(function(s,o){ return s+(o.total||o.subtotal||0); },0);
      var completed = todayOrders.filter(function(o){ return o.status==="completed"; }).length;
      var pending = todayOrders.length - completed;
      [
        {label:"Today's Orders", val:String(todayOrders.length), sub:loc.name},
        {label:"Today's Revenue", val:money(revenue), sub:"due at pickup"},
        {label:"Completed", val:String(completed), sub:"picked up today"},
        {label:"Pending", val:String(pending), sub:"new, preparing, or ready"}
      ].forEach(function(t){
        kpiGrid.appendChild(ce("div","fo-tile","<div class='fo-label'>"+t.label+"</div><div class='fo-val mono'>"+t.val+"</div><div class='fo-sub'>"+t.sub+"</div>"));
      });
    }

    function histRow(o){
      var row = ce("div","order-row");
      var itemsSummary = (o.items||[]).map(function(i){ return i.qty+"× "+i.name; }).join(", ");
      row.innerHTML =
        "<div class='or-top'>"+
          "<span class='or-number mono'>#"+(o.orderNumber||o.orderCode||"—")+"</span>"+
          "<span class='status-pill status-pill-"+o.status+"'>"+o.status+"</span>"+
        "</div>"+
        "<div class='or-cust'>"+o.customerName+"</div>"+
        "<div class='or-items'>"+itemsSummary+"</div>"+
        "<div class='or-pickup'>"+(o.pickupPref||"")+" &middot; "+money(o.total||o.subtotal||0)+"</div>";
      return row;
    }

    function renderHistRows(){
      histList.innerHTML = "";
      var now = Date.now();
      var rows;
      if(histFilter==="today"){
        rows = todayOrders.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
      } else {
        var hist = state.history[loc.id] || [];
        var rangeStart, rangeEnd;
        if(histFilter==="yesterday"){ rangeStart = now - 2*86400000; rangeEnd = now - 1*86400000; }
        else if(histFilter==="7d"){ rangeStart = now - 7*86400000; rangeEnd = now; }
        else { rangeStart = now - 30*86400000; rangeEnd = now; } // 30d
        rows = hist.filter(function(o){ return o.createdAt>=rangeStart && o.createdAt<=rangeEnd; });
        if(histFilter!=="yesterday") rows = rows.concat(todayOrders); // today's live activity also counts toward 7/30-day totals
        rows.sort(function(a,b){ return b.createdAt-a.createdAt; });
      }
      if(!rows.length){ histList.appendChild(ce("div","empty-col","No orders in this range")); return; }
      rows.slice(0,50).forEach(function(o){ histList.appendChild(histRow(o)); });
    }

    if(dashboardOrdersUnsub){ dashboardOrdersUnsub(); dashboardOrdersUnsub=null; }

    if(!db){
      var local = state.orders.filter(function(o){ return o.locationId===loc.id; });
      todayOrders = local.length ? local : sampleOrders(loc.id);
      paintKpis(); renderHistRows();
      return;
    }
    try{
      dashboardOrdersUnsub = db.collection("orders").where("locationId","==",loc.id).orderBy("createdAt","asc").limit(60).onSnapshot(function(snap){
        todayOrders = snap.docs.map(function(d){ var data=d.data()||{}; data._ref=d.ref||db.collection("orders").doc(d.id); return data; });
        paintKpis(); renderHistRows();
      }, function(){ todayOrders = sampleOrders(loc.id); paintKpis(); renderHistRows(); });
    }catch(e){ todayOrders = sampleOrders(loc.id); paintKpis(); renderHistRows(); }
  }

  function makeToggleRow(label, sub, checked, onChange){
    var row = ce("div","toggle-row");
    row.appendChild(ce("div",null,"<div class='tr-label'>"+label+"</div><div class='tr-sub'>"+sub+"</div>"));
    var sw = ce("label","switch");
    var cb = ce("input"); cb.type="checkbox"; cb.checked = checked;
    cb.addEventListener("change", function(){ onChange(cb.checked); });
    sw.appendChild(cb); sw.appendChild(ce("span","track")); sw.appendChild(ce("span","thumb"));
    row.appendChild(sw);
    return row;
  }

  // ---------------------------------------------------------------
  // ROUTER / RENDER
  // ---------------------------------------------------------------
  function render(){
    renderTopbar();
    renderGuideBanner();
    var content = qs("#content");
    if(nav.view==="staff") renderStaff(content);
    else if(nav.view==="admin") renderAdmin(content);
    else renderCustomer(content);
    renderTpDrawer();
    // The Admin Orders panel and Owner Dashboard each own a live listener only while
    // actually on screen — drop it the instant we're not there, same fix as the
    // staff-board subscription leak above.
    if(!(nav.view==="admin" && nav.adminSection==="orders") && adminOrdersUnsub){
      adminOrdersUnsub(); adminOrdersUnsub=null;
    }
    if(!(nav.view==="admin" && nav.adminSection==="dashboard") && dashboardOrdersUnsub){
      dashboardOrdersUnsub(); dashboardOrdersUnsub=null;
    }
  }

  function boot(){
    var p = params();
    if(p.get("view")==="staff") nav.view="staff";
    else if(p.get("view")==="admin") nav.view="admin";
    else nav.view="customer";
    var l = p.get("loc");
    if(l && locById(l)){ nav.locId = l; nav.adminLocId = l; }

    dbPromise.then(function(){
      if(!db){ state.orders = clone(sampleOrders(nav.locId)); render(); return; }
      db.doc("demoConfig/main").get().then(function(doc){
        var data = doc && doc.exists ? doc.data() : null;
        if(data && data.locations){
          state.locations = mergeLocations(data.locations);
        }
        loadAllMenus().then(function(){
          render();
          subscribeConfig();
          subscribeAllMenus();
        });
      }).catch(function(){ render(); });
    }).catch(function(){ render(); });

    // Each location's inventory lives in its own document (demoConfig/menu_<locId>)
    // rather than one shared doc — see persistMenu()'s comment for why (photo payload
    // size vs. the ~256KB single-document cap).
    function loadAllMenus(){
      var gets = state.locations.map(function(l){
        return db.doc("demoConfig/menu_"+l.id).get().then(function(doc){
          var data = doc && doc.exists ? doc.data() : null;
          if(data && data.menu && data.menu.length) state.menuByLoc[l.id] = data.menu;
        }).catch(function(){});
      });
      return Promise.all(gets);
    }

    // Live cross-device sync: if an owner/admin edits an address, hours, a toggle, or
    // a POS connection on one device, every other open device (e.g. a customer view
    // on a second phone/laptop mid-pitch) updates without a manual refresh.
    function subscribeConfig(){
      if(!db) return;
      try{
        var ref = db.doc("demoConfig/main");
        if(!ref || typeof ref.onSnapshot!=="function") return;
        if(configUnsub){ configUnsub(); configUnsub=null; }
        configUnsub = ref.onSnapshot(function(doc){
          var data = doc && doc.exists ? doc.data() : null;
          if(!data || !data.locations) return;
          state.locations = mergeLocations(data.locations);
          render();
        }, function(){ /* live sync unavailable — one-time load above still applies */ });
      }catch(e){ /* onSnapshot not supported on this doc — silently stay on one-time load */ }
    }

    // Same live sync, per location's own menu document — a price/photo/stock edit at
    // one location propagates to every open view instantly, without ever touching
    // another location's independent catalog.
    function subscribeAllMenus(){
      if(!db) return;
      state.locations.forEach(function(l){
        try{
          var ref = db.doc("demoConfig/menu_"+l.id);
          if(!ref || typeof ref.onSnapshot!=="function") return;
          ref.onSnapshot(function(doc){
            var data = doc && doc.exists ? doc.data() : null;
            if(!data || !data.menu) return;
            state.menuByLoc[l.id] = data.menu;
            render();
          }, function(){ /* live sync unavailable for this location — one-time load above still applies */ });
        }catch(e){ /* onSnapshot not supported — silently stay on one-time load */ }
      });
    }

    // render immediately with defaults so the page never sits blank while db resolves
    render();
  }
  boot();
})();
</script>

</body>
</html>
